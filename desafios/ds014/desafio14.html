<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio de tabelas</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        table{
            border-collapse: collapse;
        }

        caption{
            font-size:0.5em;
            font-weight: bold;
            padding: 1px;
            border: 1px solid black;
        }

        th{
            background-color: gray;
            color: white;
            border: 1px solid black;
            padding: 5px;
        }

        td{
            border: 1px solid black;
            padding: 5px;
        }

        th#subtitulo{
            background-color: gray;
            color: white;
        }

        td#subtitulo{
            background-color: gray;
            color: white;
            font-weight: bold;
        }

        tbody > tr > th{
            background: white;
            color: black;
        }
    </style>
</head>
<body>
    <h1>Tabela de notas e médias</h1>
   
    <table>
        <caption>
            <h1>Média da sala 15</h1>
        </caption>
        <thead>
            <tr>
                <th rowspan="2" scope="row">Área</th>
                <th rowspan="2" scope="rowgroup">Disciplina</th>
                <th colspan="2" scope="rowgroup">Notas</th>
                <th rowspan="2" scope="rowgroup">Média</th>
            </tr>
            <tr>
                <th scope="rowgroup">nota 1</th>
                <th scope="rowgroup">nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="colgroup">Exatas</th>
                <td>Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Biologia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="col" id="subtitulo">Média de Exatas</th>
                <td id="subtitulo">0.0</td>
            </tr>
            
            <tr>
                <th rowspan="2" scope="colgroup">Humanas</th>
                <td>História</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td>Geografia</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
             <tr>
                <th colspan="4" scope="col" id="subtitulo">Média de Humanas</th>
                <td id="subtitulo">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
